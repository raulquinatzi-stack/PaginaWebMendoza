services:
  web-mendoza-lev:
    build:
      context: .
      dockerfile: Dockerfile
    image: mendoza-lev-web:latest
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "${HOST_PORT:-3001}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
